<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up & Register | MAN Stadium Tickets - Moshood Abiola National Stadium</title>

    <!-- Google Fonts: Inter & Caveat / Kalam for handwriting placeholders -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: "#6D0808",
                        maroonDark: "#4A0505",
                        orange: "#F59E0B",
                        cream: "#F7F2EA",
                        ink: "#171717"
                    },
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
                        handwriting: ["Caveat", "Kalam", "cursive"]
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        /* Handwriting fonts for all placeholders */
        input::placeholder,
        textarea::placeholder,
        select::placeholder,
        ::placeholder {
            font-family: 'Caveat', 'Kalam', cursive !important;
            font-size: 1.15rem !important;
            font-weight: 600 !important;
            letter-spacing: 0.02em !important;
            color: #9CA3AF !important;
        }
    </style>
</head>

<body class="min-h-screen bg-maroon text-ink flex flex-col justify-between relative overflow-x-hidden">

    <!-- Stadium Background with Maroon Gradient Blend -->
    <div class="fixed inset-0 pointer-events-none">
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d2/Football_heaven.jpg"
            alt="Moshood Abiola National Stadium, Abuja"
            class="h-full w-full object-cover object-center opacity-30"
            onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Moshood_Abiola_National_Stadium%2C_Abuja.jpg/1280px-Moshood_Abiola_National_Stadium%2C_Abuja.jpg';" />
        <div class="absolute inset-0 bg-gradient-to-t from-maroonDark via-maroonDark/85 to-maroon/90"></div>
    </div>

    <!-- Top Compact Header -->
    <header class="relative z-20 w-full px-5 py-3">
        <div class="mx-auto flex max-w-4xl items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 text-white transition hover:opacity-90">
                <!-- New Stadium Logo -->
                <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-amber-500 to-orange text-maroon shadow-md shadow-orange/30 transition hover:scale-105">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 13c0 4.4 4.5 8 10 8s10-3.6 10-8" />
                        <path d="M2 13c0-4.4 4.5-8 10-8s10 3.6 10 8" />
                        <path d="M6 13c0 2.2 2.7 4 6 4s6-1.8 6-4" />
                        <path d="M6 13c0-2.2 2.7-4 6-4s6 1.8 6 4" />
                        <circle cx="12" cy="13" r="1.5" fill="currentColor" />
                        <path d="M12 2v3" />
                        <path d="M5 4l2 2" />
                        <path d="M19 4l-2 2" />
                    </svg>
                </div>
                <div>
                    <div class="text-sm font-extrabold leading-none tracking-tight text-white">MAN STADIUM</div>
                    <div class="mt-0.5 text-[9px] font-semibold uppercase tracking-[.22em] text-white/70">
                        Official Ticketing
                    </div>
                </div>
            </a>

            <a href="index.html" class="rounded-lg border border-white/20 bg-white/10 px-3 py-1.5 text-xs font-semibold text-white backdrop-blur transition hover:bg-white/20">
                ← Back to Home
            </a>
        </div>
    </header>

    <!-- Main Content Container: Reduced to a compact, single-centered card -->
    <main class="relative z-20 flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-[420px] rounded-2xl bg-white p-5 sm:p-6 shadow-2xl ring-1 ring-black/10">
            
            <!-- Auth Alert Box -->
            <div id="auth-alert" class="hidden mb-3 rounded-xl p-3 text-xs font-bold"></div>

            <!-- Segmented Tab Switcher -->
            <div class="mb-4 flex rounded-xl bg-gray-100 p-1 shadow-inner">
                <button type="button" id="tab-login" onclick="switchAuthTab('login')" 
                    class="flex-1 rounded-lg py-1.5 text-xs font-bold uppercase tracking-wider transition-all duration-200 text-gray-500 hover:text-gray-900">
                    Sign In
                </button>
                <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" 
                    class="flex-1 rounded-lg py-1.5 text-xs font-black uppercase tracking-wider transition-all duration-200 bg-white text-maroon shadow-sm">
                    Create Account
                </button>
            </div>

            <!-- LOGIN VIEW -->
            <div id="login-view" class="hidden">
                <div class="mb-3.5 text-center">
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-gray-900">
                        Welcome back
                    </h1>
                </div>

                <form id="login-form" action="#" method="POST" onsubmit="handleLoginSubmit(event)" class="space-y-3">
                    <div>
                        <label for="login-email" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                            Email Address or Phone
                        </label>
                        <div class="relative mt-1">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                                </svg>
                            </span>
                            <input id="login-email" type="text" required placeholder="name@example.com or 080..." 
                                class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 pl-9 pr-3 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <label for="login-password" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                                Password
                            </label>
                            <a href="#" class="text-[11px] font-semibold text-maroon hover:underline">
                                Forgot?
                            </a>
                        </div>
                        <div class="relative mt-1">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </span>
                            <input id="login-password" type="password" required placeholder="Enter secret password" 
                                class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 pl-9 pr-10 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                            <button type="button" onclick="togglePassword('login-password', 'login-eye')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                                <svg id="login-eye" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center pt-0.5">
                        <input id="remember" type="checkbox" checked class="h-3.5 w-3.5 rounded border-gray-300 text-maroon focus:ring-maroon accent-[#6D0808]">
                        <label for="remember" class="ml-2 block text-xs text-gray-600">
                            Remember me on this device
                        </label>
                    </div>

                    <button type="submit" 
                        class="mt-1 w-full rounded-xl bg-maroon py-2.5 text-xs font-extrabold uppercase tracking-wider text-white shadow-md shadow-maroon/20 transition hover:bg-maroonDark active:scale-[0.99]">
                        Sign In to MAN Stadium
                    </button>

                    <!-- One-Click Demo Fan Login Button -->
                    <button type="button" onclick="fillDemoAndLogin()" class="w-full rounded-xl border border-amber-300 bg-amber-50/90 py-2 text-xs font-bold text-amber-900 transition hover:bg-amber-100 flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.99]">
                        <span>⚡ Instant Demo Fan Sign In (Chukwudi)</span>
                    </button>
                </form>
            </div>

            <!-- SIGNUP VIEW -->
            <div id="signup-view">
                <div class="mb-3.5 text-center">
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-gray-900">
                        Create account
                    </h1>
                </div>

                <form id="signup-form" action="#" method="POST" onsubmit="handleSignupSubmit(event)" class="space-y-2.5">
                    <div>
                        <label for="signup-name" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                            Full Name
                        </label>
                        <div class="relative mt-1">
                            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input id="signup-name" type="text" required placeholder="e.g. Chukwudi Adeleke" 
                                class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 pl-9 pr-3 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label for="signup-email" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                                Email Address
                            </label>
                            <div class="relative mt-1">
                                <input id="signup-email" type="email" required placeholder="name@example.com" 
                                    class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 px-3 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                            </div>
                        </div>

                        <div>
                            <label for="signup-phone" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                                Phone Number
                            </label>
                            <div class="relative mt-1">
                                <input id="signup-phone" type="tel" required placeholder="+234 801..." 
                                    class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 px-3 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="signup-password" class="block text-[11px] font-bold uppercase tracking-wider text-gray-700">
                            Create Password
                        </label>
                        <div class="relative mt-1">
                            <input id="signup-password" type="password" required minlength="6" placeholder="At least 6 characters" 
                                oninput="checkPasswordStrength(this.value)"
                                class="w-full rounded-lg border border-gray-200 bg-gray-50/50 py-2 pl-3 pr-9 text-xs text-gray-900 outline-none transition focus:border-maroon focus:bg-white focus:ring-1 focus:ring-maroon/20" />
                            <button type="button" onclick="togglePassword('signup-password', 'signup-eye')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                                <svg id="signup-eye" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <div class="mt-1 flex items-center gap-1.5">
                            <div id="bar-1" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
                            <div id="bar-2" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
                            <div id="bar-3" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors"></div>
                            <span id="strength-text" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider ml-1"></span>
                        </div>
                    </div>

                    <div class="flex items-start pt-0.5">
                        <input id="terms" type="checkbox" required class="mt-0.5 h-3.5 w-3.5 rounded border-gray-300 text-maroon focus:ring-maroon accent-[#6D0808]">
                        <label for="terms" class="ml-2 block text-[11px] leading-4 text-gray-600">
                            I agree to the <a href="#" class="font-bold text-maroon hover:underline">Terms</a> and ticketing code.
                        </label>
                    </div>

                    <button type="submit" 
                        class="mt-1 w-full rounded-xl bg-orange py-2.5 text-xs font-extrabold uppercase tracking-wider text-maroon shadow-md shadow-orange/20 transition hover:bg-amber-400 active:scale-[0.99]">
                        Create Stadium Account
                    </button>
                </form>
            </div>

            <!-- Footer Link -->
            <p class="mt-4 text-center text-xs text-gray-500">
                <span id="footer-prompt">Already have an account?</span>
                <button type="button" id="footer-btn" onclick="toggleAuthMode()" class="font-bold text-maroon hover:underline ml-1">
                    Log in here →
                </button>
            </p>

        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="relative z-20 py-3 text-center text-xs text-white/50">
        © 2026 MAN Stadium Ticketing System. Moshood Abiola National Stadium, Abuja.
    </footer>

    <script>
        let currentTab = 'signup';

        function switchAuthTab(tab) {
            currentTab = tab;
            const loginView = document.getElementById('login-view');
            const signupView = document.getElementById('signup-view');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const footerPrompt = document.getElementById('footer-prompt');
            const footerBtn = document.getElementById('footer-btn');

            if (tab === 'login') {
                loginView.classList.remove('hidden');
                signupView.classList.add('hidden');
                tabLogin.className = 'flex-1 rounded-lg py-1.5 text-xs font-black uppercase tracking-wider transition-all duration-200 bg-white text-maroon shadow-sm';
                tabSignup.className = 'flex-1 rounded-lg py-1.5 text-xs font-bold uppercase tracking-wider transition-all duration-200 text-gray-500 hover:text-gray-900';
                footerPrompt.textContent = 'Need an account?';
                footerBtn.textContent = 'Create a free account →';
                window.location.hash = 'login';
            } else {
                signupView.classList.remove('hidden');
                loginView.classList.add('hidden');
                tabSignup.className = 'flex-1 rounded-lg py-1.5 text-xs font-black uppercase tracking-wider transition-all duration-200 bg-white text-maroon shadow-sm';
                tabLogin.className = 'flex-1 rounded-lg py-1.5 text-xs font-bold uppercase tracking-wider transition-all duration-200 text-gray-500 hover:text-gray-900';
                footerPrompt.textContent = 'Already have an account?';
                footerBtn.textContent = 'Log in here →';
                window.location.hash = 'signup';
            }
        }

        function toggleAuthMode() {
            switchAuthTab(currentTab === 'login' ? 'signup' : 'login');
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        function checkPasswordStrength(password) {
            const b1 = document.getElementById('bar-1');
            const b2 = document.getElementById('bar-2');
            const b3 = document.getElementById('bar-3');
            const txt = document.getElementById('strength-text');

            if (!password) {
                b1.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                b2.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                b3.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                txt.textContent = '';
                return;
            }

            if (password.length < 6) {
                b1.className = 'h-1 flex-1 rounded-full bg-red-500 transition-colors';
                b2.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                b3.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                txt.textContent = 'Weak';
                txt.className = 'text-[9px] font-bold text-red-500 uppercase tracking-wider ml-1';
            } else if (password.length < 9) {
                b1.className = 'h-1 flex-1 rounded-full bg-orange transition-colors';
                b2.className = 'h-1 flex-1 rounded-full bg-orange transition-colors';
                b3.className = 'h-1 flex-1 rounded-full bg-gray-200 transition-colors';
                txt.textContent = 'Medium';
                txt.className = 'text-[9px] font-bold text-orange uppercase tracking-wider ml-1';
            } else {
                b1.className = 'h-1 flex-1 rounded-full bg-emerald-500 transition-colors';
                b2.className = 'h-1 flex-1 rounded-full bg-emerald-500 transition-colors';
                b3.className = 'h-1 flex-1 rounded-full bg-emerald-500 transition-colors';
                txt.textContent = 'Strong';
                txt.className = 'text-[9px] font-bold text-emerald-500 uppercase tracking-wider ml-1';
            }
        }

        // Auth Handlers
        async function handleLoginSubmit(e) {
            e.preventDefault();
            showAlert('', 'clear');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying credentials...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert('🎉 ' + data.message, 'success');
                    localStorage.setItem('man_user', JSON.stringify(data.user));
                    if (data.token) localStorage.setItem('man_token', data.token);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    showAlert(data.message || 'Login failed. Please check credentials.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to MAN Stadium';
                }
            } catch (err) {
                showAlert('Network or server error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to MAN Stadium';
            }
        }

        async function handleSignupSubmit(e) {
            e.preventDefault();
            showAlert('', 'clear');
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const phone = document.getElementById('signup-phone').value;
            const password = document.getElementById('signup-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert('🎉 ' + data.message, 'success');
                    localStorage.setItem('man_user', JSON.stringify(data.user));
                    if (data.token) localStorage.setItem('man_token', data.token);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    showAlert(data.message || 'Registration failed.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Stadium Account';
                }
            } catch (err) {
                showAlert('Network or server error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Stadium Account';
            }
        }

        function fillDemoAndLogin() {
            document.getElementById('login-email').value = 'fan@manstadium.ng';
            document.getElementById('login-password').value = 'password123';
            switchAuthTab('login');
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }

        function showAlert(msg, type) {
            const el = document.getElementById('auth-alert');
            if (!el) return;
            if (type === 'clear') {
                el.className = 'hidden';
                el.textContent = '';
                return;
            }
            el.classList.remove('hidden');
            if (type === 'success') {
                el.className = 'mb-3 rounded-xl bg-green-50 border border-green-200 p-3 text-xs font-bold text-green-800 text-center animate-in fade-in';
            } else {
                el.className = 'mb-3 rounded-xl bg-red-50 border border-red-200 p-3 text-xs font-bold text-red-800 text-center animate-in fade-in';
            }
            el.textContent = msg;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // Check if already authenticated
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (e) {}
        });
    </script>
</body>

</html>
